<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Todos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint (app.js keeps it up to date).
    try {
      const vars = JSON.parse(localStorage.getItem('themeVars') || '{}');
      for (const k in vars) document.documentElement.style.setProperty(k, vars[k]);
    } catch {}
  </script>
</head>
<body>
  <div class="layout">
    <nav id="sidebar" aria-label="Categories">
      <ul id="nav-fixed" class="nav"></ul>
      <ul id="nav-tree" class="nav"></ul>
      <button id="new-category" class="quiet small">New category</button>
      <ul id="nav-rooms" class="nav"></ul>
      <button id="new-room" class="quiet small">New room</button>
      <ul id="nav-archive" class="nav"></ul>
      <button id="theme-btn" class="quiet small">Theme</button>
    </nav>

    <main>
      <h1 class="visually-hidden">Todos</h1>

      <header class="meta">
        <button id="nav-toggle" class="quiet" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h10M3 8h10M3 11h10"/></svg>
          <span class="visually-hidden">Categories</span>
        </button>
        <div id="crumbs" class="crumbs"></div>
        <button id="usage-strip" class="usage-strip quiet" hidden title="Claude usage"></button>
        <span id="open-count" class="count-label"></span>
        <div class="menu-wrap">
          <button id="cat-menu-btn" class="quiet icon" aria-haspopup="menu" aria-expanded="false" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke-width="2.4"/></svg>
            <span class="visually-hidden">Category options</span>
          </button>
          <div id="cat-menu" class="menu" role="menu" hidden>
            <button role="menuitem" data-action="add-sub">New subcategory</button>
            <button role="menuitem" data-action="rename">Rename</button>
            <button role="menuitem" data-action="move">Move to…</button>
            <button role="menuitem" data-action="style">Style…</button>
            <button role="menuitem" data-action="archive">Archive</button>
            <button role="menuitem" data-action="delete" class="danger">Delete</button>
            <button role="menuitem" data-action="room-rename">Rename</button>
            <button role="menuitem" data-action="room-topic">Topic…</button>
            <button role="menuitem" data-action="room-archive">Archive</button>
            <button role="menuitem" data-action="room-prune">Prune messages…</button>
            <button role="menuitem" data-action="room-delete" class="danger">Delete room</button>
          </div>
        </div>
      </header>

      <section id="room-info" class="room-info" hidden>
        <p id="room-topic" class="room-topic"></p>
        <p id="room-members" class="room-members"></p>
      </section>

      <section id="room-log-section" class="room-log-section" hidden>
        <div class="log-bar">
          <h2 class="log-title">Messages</h2>
          <button id="log-pruned" class="quiet small" hidden></button>
        </div>
        <ol id="room-log" class="room-log" aria-live="polite"></ol>
        <p id="room-log-empty" class="empty small" hidden></p>
        <div id="log-pruned-bar" class="done-bar pruned-bar" hidden>
          <span>Restoring puts a message back in its place by time, with a free number.</span>
          <button id="log-purge" class="quiet">Delete all for good</button>
        </div>
        <form id="room-post" autocomplete="off">
          <label for="room-text" class="visually-hidden">Message</label>
          <textarea id="room-text" rows="2" maxlength="10000" aria-autocomplete="list" aria-controls="mentions"></textarea>
          <ul id="mentions" class="menu mentions" role="listbox" hidden></ul>
          <div class="post-bar">
            <ul id="post-files" class="post-files" aria-label="Files to attach"></ul>
            <button id="attach-btn" type="button" class="quiet small" title="Any file: images up to 10 MB, videos 50 MB, others 200 MB. You can also paste or drop them here.">Attach…</button>
            <input id="file-input" type="file" multiple hidden>
          </div>
        </form>
      </section>

      <form id="add-form" autocomplete="off">
        <label for="new-title" class="visually-hidden">New todo</label>
        <input id="new-title" type="text" placeholder="What's next?" maxlength="500">
      </form>

      <div id="open-groups"></div>
      <p id="empty" class="empty" hidden></p>

      <section id="done-section" hidden>
        <div class="done-bar">
          <button id="done-toggle" class="quiet" aria-expanded="false" aria-controls="done-list">
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
            <span id="done-count"></span>
          </button>
          <button id="clear-done" class="quiet" title="Moves them to Pruned and frees their numbers">Prune done</button>
        </div>
        <ul id="done-list" class="list" hidden></ul>
      </section>


      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </div>

  <dialog id="dialog"></dialog>
  <dialog id="usage-dialog" class="usage-dialog"></dialog>

  <template id="item-tpl">
    <li class="item" draggable="true">
      <button class="check" role="checkbox" aria-checked="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8.5l2.5 2.5L12 5.5"/></svg>
      </button>
      <div class="body">
        <div class="title-row">
          <span class="prio"></span>
          <span class="title" tabindex="0"></span>
        </div>
        <div class="item-meta">
          <span class="due"></span>
          <span class="tag"></span>
          <span class="room-tag"></span>
          <span class="claimed"></span>
        </div>
        <p class="desc" hidden></p>
      </div>
      <div class="actions">
        <button class="claim quiet icon" aria-label="Claim" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"/><path d="M3.5 13.5c.6-2.4 2.4-3.7 4.5-3.7s3.9 1.3 4.5 3.7"/></svg>
        </button>
        <button class="plan quiet icon" aria-label="Description, priority and deadline">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>
        </button>
        <button class="move quiet icon" aria-label="Move to category">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5v7a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H8L6.5 3.5h-3a1 1 0 0 0-1 1zM7 9h4M9.5 7.5L11 9l-1.5 1.5"/></svg>
        </button>
        <button class="prune quiet icon" aria-label="Prune (frees its number)" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="11.5" r="2"/><circle cx="11.5" cy="11.5" r="2"/><path d="M5.8 10L12 2.5M10.2 10L4 2.5"/></svg>
        </button>
        <button class="delete quiet icon" aria-label="Delete">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
